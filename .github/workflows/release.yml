name: Release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes describing the purpose of this release
        required: true
        type: string
      publish:
        description: Publish to NuGet and create the GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  PROJECT_PATH: src/RunnethOverStudio.AppToolkit/RunnethOverStudio.AppToolkit.csproj
  PACKAGE_ID: RunnethOverStudio.AppToolkit
  PACKAGE_DIRECTORY: src/RunnethOverStudio.AppToolkit/bin/Release/net10.0/NuGet

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      # Releases are intentionally produced only from main. The protected
      # publishing environment independently enforces the same restriction.
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases must be built from main."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "$env:PROJECT_PATH"
          # XML element values can preserve formatting whitespace from the project file.
          # Normalize it before validating and using the version in paths/tags.
          $version = ([string]$project.Project.PropertyGroup.Version |
            Where-Object { $_ } |
            Select-Object -First 1).Trim()

          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?) {
            throw "Project version '$version' is not a valid semantic version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

          Write-Host "Preparing AppToolkit $version."

      - name: Verify release tag does not already exist
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists."
            exit 1
          fi

      # Cake remains the authoritative release build so local and CI releases
      # use the same restore, image-processing, build, and packaging pipeline.
      - name: Run Cake release build
        working-directory: build/Build
        run: dotnet run -- --configuration=Release

      - name: Validate NuGet packages
        shell: bash
        run: |
          package="${PACKAGE_DIRECTORY}/${PACKAGE_ID}.${{ steps.version.outputs.version }}.nupkg"
          symbols="${PACKAGE_DIRECTORY}/${PACKAGE_ID}.${{ steps.version.outputs.version }}.snupkg"

          test -f "$package" || { echo "::error::Expected package not found: $package"; exit 1; }
          test -f "$symbols" || { echo "::error::Expected symbol package not found: $symbols"; exit 1; }

          shopt -s nullglob
          packages=("${PACKAGE_DIRECTORY}"/*.nupkg)
          symbols_packages=("${PACKAGE_DIRECTORY}"/*.snupkg)

          if (( ${#packages[@]} != 1 )); then
            echo "::error::Expected exactly one .nupkg but found ${#packages[@]}."
            exit 1
          fi

          if (( ${#symbols_packages[@]} != 1 )); then
            echo "::error::Expected exactly one .snupkg but found ${#symbols_packages[@]}."
            exit 1
          fi

          echo "Validated:"
          echo "  $package"
          echo "  $symbols"

      # Preserve the exact packages produced by the build job. The publish job
      # downloads these artifacts rather than rebuilding the release.
      - name: Upload release packages
        uses: actions/upload-artifact@v7
        with:
          name: AppToolkit-${{ steps.version.outputs.version }}
          path: |
            ${{ env.PACKAGE_DIRECTORY }}/*.nupkg
            ${{ env.PACKAGE_DIRECTORY }}/*.snupkg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    # This protected environment is the deliberate approval boundary before
    # anything can be published externally.
    environment: nuget-production

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          name: AppToolkit-${{ needs.build.outputs.version }}
          path: release-packages

      # NuGet Trusted Publishing exchanges GitHub's OIDC identity for a
      # short-lived API key; no long-lived NuGet API key is stored in GitHub.
      - name: Authenticate to NuGet
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # dotnet nuget push automatically publishes a matching .snupkg found
      # beside the .nupkg, so the symbol package must not be pushed separately.
      - name: Publish package to NuGet
        shell: bash
        run: |
          dotnet nuget push "release-packages/${PACKAGE_ID}.${{ needs.build.outputs.version }}.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          gh release create "${{ needs.build.outputs.tag }}" \
            "release-packages/${PACKAGE_ID}.${{ needs.build.outputs.version }}.nupkg" \
            "release-packages/${PACKAGE_ID}.${{ needs.build.outputs.version }}.snupkg" \
            --target "${{ github.sha }}" \
            --title "${{ needs.build.outputs.tag }} Release" \
            --notes "$RELEASE_NOTES"
